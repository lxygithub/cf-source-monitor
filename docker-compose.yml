services:
  cf-monitor:
    build: .
    container_name: cf-monitor
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # ── 方案 A：SQLite（默认）。配合下方 volumes 挂载持久化 ──
      DATABASE_URL: file:/app/db/custom.db

      # ── 方案 B：MySQL ──
      # 使用时注释掉上面的 SQLite 行与 volumes 段，并取消注释下行
      # ⚠️ 密码特殊字符必须 URL 编码：# → %23，[ → %5B（详见 DEPLOY.md）
      # DATABASE_URL: "mysql://用户名:URL编码后的密码@主机:端口/cf_monitor?connection_limit=10"
      #
      # 容器访问宿主机上的 MySQL 时，主机地址用：
      #   Docker Desktop: host.docker.internal
      #   Linux: 先在下方 extra_hosts 启用 host-gateway 映射
      #
      # extra_hosts:
      #   - "host.docker.internal:host-gateway"
    volumes:
      - ./db:/app/db
